<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
  :root { --bg:#fff; --card:#f8f8f8; --text:#222; --muted:#888; --accent:#c8860a; --green:#3a8c3a; --red:#c0392b; --border:#ddd; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif; font-size:15px; max-width:600px; margin:0 auto; padding:20px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:20px; }

  .section { background:var(--card); border-radius:10px; padding:16px; margin-bottom:14px; }
  .section h2 { font-size:16px; margin-bottom:12px; }

  .field { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .field label { width:100px; font-size:13px; color:var(--muted); flex-shrink:0; text-align:right; }
  .field input, .field select { flex:1; padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  .field input[type=number] { width:100px; flex:none; }

  .task-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .task-row:last-child { border-bottom:none; }
  .task-row input { flex:1; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
  .task-row input.name { flex:3; }
  .task-row input.points { width:70px; flex:none; }
  .task-row button { background:var(--red); color:#fff; border:none; border-radius:4px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .task-row button:hover { opacity:0.8; }

  .btn-row { display:flex; gap:10px; margin-top:16px; }
  .btn { flex:1; padding:12px; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-save { background:var(--accent); color:#fff; }
  .btn-add { background:var(--border); color:var(--text); font-size:13px; }

  .ledger-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .ledger-row input { padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; }
  .ledger-row input.name { flex:3; }
  .ledger-row input.date { width:60px; flex:none; }
  .ledger-row input.amount { width:70px; flex:none; }
  .ledger-row .del { color:var(--red); cursor:pointer; font-size:14px; }

  .msg { text-align:center; padding:8px; border-radius:6px; margin-bottom:12px; display:none; }
  .msg.ok { display:block; background:#e8f5e9; color:var(--green); }
  .msg.err { display:block; background:#fde8e8; color:var(--red); }
</style>
</head>
<body>

<h1>⚙️ 管理后台</h1>
<div class="sub">修改后点击保存 → 电纸书刷新页面自动更新</div>
<div class="msg" id="msg"></div>

<div class="section">
  <h2>💰 当前积分</h2>
  <div class="field">
    <label>积分</label>
    <input type="number" id="points" value="1250">
  </div>
</div>

<div class="section">
  <h2>📋 积分明细</h2>
  <div id="ledger-rows"></div>
  <button class="btn-add" onclick="addLedger()">+ 添加记录</button>
</div>

<div class="section">
  <h2>📚 常驻任务</h2>
  <div id="resident-rows"></div>
  <button class="btn-add" onclick="addTask('resident')">+ 添加任务</button>
</div>

<div class="section">
  <h2>⏳ 悬赏任务</h2>
  <div id="bounty-rows"></div>
  <button class="btn-add" onclick="addTask('bounty')">+ 添加任务</button>
</div>

<div class="section">
  <h2>🏆 挑战 · 已激活</h2>
  <div id="challenge-active-rows"></div>
  <button class="btn-add" onclick="addChallenge('activated')">+ 添加</button>
</div>

<div class="section">
  <h2>🏆 挑战 · 待激活</h2>
  <div id="challenge-pending-rows"></div>
  <button class="btn-add" onclick="addChallenge('pending')">+ 添加</button>
</div>

<div class="btn-row">
  <button class="btn btn-save" onclick="save()">💾 保存</button>
</div>

<script>
let DATA = {};

async function init() {
  try {
    const r = await fetch('data.json');
    DATA = await r.json();
  } catch(e) {
    DATA = { points:0, ledger:[], taskGroups:[], shop:[] };
  }
  document.getElementById('points').value = DATA.points || 0;
  renderAll();
}

function renderAll() {
  // Ledger
  document.getElementById('ledger-rows').innerHTML = (DATA.ledger||[]).map((l,i) =>
    `<div class="ledger-row">
      <input class="name" value="${l.name}" onchange="DATA.ledger[${i}].name=this.value">
      <input class="date" value="${l.date}" onchange="DATA.ledger[${i}].date=this.value">
      <input class="amount" type="number" value="${l.amount}" onchange="DATA.ledger[${i}].amount=+this.value">
      <span class="del" onclick="DATA.ledger.splice(${i},1);renderAll()">✕</span>
    </div>`).join('');

  // Find task groups
  const tg = DATA.taskGroups || [];
  const resident = tg.find(g => g.type === 'resident');
  const bounty = tg.find(g => g.type === 'bounty');
  const challenge = tg.find(g => g.type === 'challenge');

  renderTaskRows('resident-rows', resident ? resident.tasks : []);
  renderTaskRows('bounty-rows', bounty ? bounty.tasks : []);
  renderTaskRows('challenge-active-rows', challenge ? (challenge.groups.activated||[]) : [], 'challenge');
  renderTaskRows('challenge-pending-rows', challenge ? (challenge.groups.pending||[]) : [], 'challenge');
}

function renderTaskRows(id, tasks, type) {
  const t = type === 'challenge' ? tasks : tasks;
  document.getElementById(id).innerHTML = t.map((tk,i) =>
    `<div class="task-row">
      <input class="name" value="${tk.name}" onchange="tasks[${i}].name=this.value">
      <input value="${tk.type||''}" style="width:60px;flex:none" onchange="tasks[${i}].type=this.value">
      <input class="points" value="${tk.points}" onchange="tasks[${i}].points=isNaN(+this.value)?this.value:+this.value">
      <button onclick="tasks.splice(${i},1);renderAll()">✕</button>
    </div>`).join('');
}

function addLedger() {
  DATA.ledger = DATA.ledger || [];
  DATA.ledger.push({ name:'', date:new Date().getMonth()+1+'/'+new Date().getDate(), amount:0 });
  renderAll();
}

function addTask(type) {
  const tg = DATA.taskGroups || [];
  let group = tg.find(g => g.type === type);
  if (!group) {
    if (type === 'challenge') {
      group = { title:'🏆 挑战', type:'challenge', groups:{ activated:[], pending:[] } };
    } else {
      group = { title: type==='bounty'?'⏳ 悬赏任务':'📚 常驻任务', type, tasks:[] };
    }
    tg.push(group);
    DATA.taskGroups = tg;
  }
  group.tasks.push({ name:'', type:'推荐', points:100, icon:'📖' });
  renderAll();
}

function addChallenge(subtype) {
  const tg = DATA.taskGroups || [];
  let group = tg.find(g => g.type === 'challenge');
  if (!group) { group = { title:'🏆 挑战', type:'challenge', groups:{ activated:[], pending:[] } }; tg.push(group); DATA.taskGroups = tg; }
  group.groups[subtype].push({ name:'', type:'考试', detail:'', points:500, icon:'🏅' });
  renderAll();
}

async function save() {
  DATA.points = +document.getElementById('points').value || 0;
  const json = JSON.stringify(DATA, null, 2);

  try {
    const r = await fetch('/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:json });
    if (r.ok) {
      showMsg('✅ 保存成功！电纸书刷新页面即可看到更新', 'ok');
    } else {
      showMsg('❌ 保存失败: ' + (await r.text()), 'err');
    }
  } catch(e) {
    showMsg('❌ 无法连接服务器。请确保 python server.py 正在运行', 'err');
  }
}

function showMsg(text, cls) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + cls;
  setTimeout(() => m.className = 'msg', 3000);
}

init();
</script>
</body>
</html>
